name: Publish Voicebox image

# Builds Voicebox straight from the upstream release tag (its own Dockerfile),
# because upstream's ghcr.io/jamiepine/voicebox images are not updated for releases.
on:
  push:
    branches:
      - main
    paths:
      - "voicebox/**"
      - ".github/workflows/publish-voicebox.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Upstream release to build: https://github.com/jamiepine/voicebox/releases
  VOICEBOX_VERSION: "0.6.0"
  IMAGE: ghcr.io/chocolateandmilkwin/voicebox

jobs:
  cpu-arm64:
    # Native arm64 runner (free for public repositories) for the radxa nodes.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/jamiepine/voicebox.git#v${{ env.VOICEBOX_VERSION }}
          platforms: linux/arm64
          build-args: |
            PYTORCH_VARIANT=cpu
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VOICEBOX_VERSION }}-cpu
            ${{ env.IMAGE }}:sha-${{ github.sha }}-cpu
